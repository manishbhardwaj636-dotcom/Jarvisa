<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>J.A.R.V.I.S. — Holographic AI Assistant</title>
<style>
  :root {
    --primary: #00f0ff;
    --secondary: #7000ff;
    --glow: rgba(0, 240, 255, 0.5);
    --bg: #030712;
    --panel: rgba(11, 22, 44, 0.82);
    --border: rgba(0, 240, 255, 0.28);
    --text: #eaf8ff;
  }

  body.state-standby { --primary: #00f0ff; --glow: rgba(0, 240, 255, 0.42); }
  body.state-listening { --primary: #00ff9d; --glow: rgba(0, 255, 157, 0.6); }
  body.state-thinking { --primary: #ffbe3b; --glow: rgba(255, 190, 59, 0.6); }
  body.state-speaking { --primary: #b17aff; --glow: rgba(177, 122, 255, 0.65); }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

  body {
    background: radial-gradient(circle at 50% 32%, #0d1f42 0%, var(--bg) 75%);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 14px;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.045) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  /* Top Bar */
  .top-bar {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 3;
    padding: 10px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
  }

  .hud-clock { font-size: 1.15rem; font-weight: 700; letter-spacing: 1px; color: var(--primary); }
  .hud-date { font-size: 0.78rem; opacity: 0.8; }

  .top-actions { display: flex; gap: 8px; align-items: center; }

  .icon-btn {
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid var(--border);
    color: var(--text);
    height: 38px;
    padding: 0 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.95rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: 0.2s;
  }
  .icon-btn:hover { background: rgba(0, 240, 255, 0.24); transform: translateY(-1px); }

  /* Holographic AI Avatar Stage */
  .avatar-stage {
    position: relative;
    width: 270px;
    height: 270px;
    display: grid;
    place-items: center;
    margin: 8px 0;
    z-index: 2;
    cursor: pointer;
    user-select: none;
  }

  .halo-outer {
    position: absolute;
    width: 260px; height: 260px;
    border-radius: 50%;
    border: 2px dashed var(--primary);
    opacity: 0.55;
    animation: spinCW 18s linear infinite;
  }

  .halo-inner {
    position: absolute;
    width: 224px; height: 224px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--primary);
    border-bottom-color: var(--primary);
    box-shadow: 0 0 25px var(--glow);
    animation: spinCCW 9s linear infinite;
  }

  body.state-listening .halo-inner { animation-duration: 3s; }
  body.state-speaking .halo-inner { animation-duration: 2s; }

  .avatar-holo {
    position: relative;
    width: 184px;
    height: 184px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, rgba(0, 240, 255, 0.22), rgba(6, 14, 32, 0.95) 75%);
    border: 2px solid var(--primary);
    box-shadow: 0 0 36px var(--glow), inset 0 0 24px var(--glow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    animation: floatAvatar 3.6s ease-in-out infinite;
  }

  /* Scanline effect inside avatar */
  .avatar-holo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0, 240, 255, 0.06) 4px
    );
    pointer-events: none;
  }

  /* AI Face SVG */
  .ai-face { width: 120px; height: 120px; z-index: 2; }
  .ai-eye {
    fill: var(--primary);
    filter: drop-shadow(0 0 6px var(--primary));
    transform-origin: center;
    animation: blinkEye 4.5s infinite;
  }
  .ai-mouth {
    stroke: var(--primary);
    stroke-width: 3.5;
    stroke-linecap: round;
    fill: none;
    filter: drop-shadow(0 0 6px var(--primary));
    transition: d 0.15s ease;
  }
  body.state-speaking .ai-mouth {
    animation: talkMouth 0.28s ease-in-out infinite alternate;
  }

  /* Namaste Hands Badge */
  .namaste-badge {
    position: absolute;
    bottom: 10px;
    background: rgba(0, 240, 255, 0.16);
    border: 1px solid var(--primary);
    color: #fff;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    z-index: 3;
    box-shadow: 0 0 12px var(--glow);
    animation: namastePulse 2.4s ease-in-out infinite;
  }

  @keyframes spinCW { to { transform: rotate(360deg); } }
  @keyframes spinCCW { to { transform: rotate(-360deg); } }
  @keyframes floatAvatar {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }
  @keyframes blinkEye {
    0%, 94%, 100% { transform: scaleY(1); }
    97% { transform: scaleY(0.1); }
  }
  @keyframes talkMouth {
    0% { transform: scaleY(0.6); }
    100% { transform: scaleY(1.45); }
  }
  @keyframes namastePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* Status Pill */
  .status-pill {
    z-index: 2;
    padding: 7px 18px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 600;
    background: var(--panel);
    border: 1px solid var(--primary);
    color: var(--primary);
    box-shadow: 0 0 16px var(--glow);
    margin-bottom: 8px;
    text-align: center;
  }

  /* Quick Action Chips */
  .quick-chips {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    z-index: 2;
    scrollbar-width: none;
  }
  .quick-chips::-webkit-scrollbar { display: none; }
  .chip {
    white-space: nowrap;
    background: rgba(0, 240, 255, 0.09);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .chip:hover { background: rgba(0, 240, 255, 0.24); border-color: var(--primary); }

  /* Chat Box */
  .chat-box {
    width: 100%;
    max-width: 720px;
    z-index: 2;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    backdrop-filter: blur(12px);
    min-height: 105px;
    max-height: 195px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg-user { align-self: flex-end; background: rgba(0, 240, 255, 0.16); padding: 7px 12px; border-radius: 12px 12px 2px 12px; font-size: 0.9rem; max-width: 85%; }
  .msg-ai { align-self: flex-start; background: rgba(255, 255, 255, 0.06); border-left: 3px solid var(--primary); padding: 8px 12px; border-radius: 4px 12px 12px 12px; font-size: 0.94rem; line-height: 1.45; max-width: 92%; }

  /* Active Timers */
  .badges-wrap {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    z-index: 2;
    margin-top: 6px;
  }
  .timer-badge {
    background: rgba(255, 190, 59, 0.16);
    border: 1px solid rgba(255, 190, 59, 0.5);
    color: #ffe299;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .timer-badge button { background: none; border: none; color: #ff7b7b; cursor: pointer; font-weight: bold; }

  /* YouTube Player with IFrame API */
  #yt-container {
    width: 100%;
    max-width: 720px;
    margin-top: 8px;
    z-index: 2;
    display: none;
    background: var(--panel);
    border: 1px solid var(--primary);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 24px rgba(0, 240, 255, 0.2);
  }
  .yt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 12px;
    font-size: 0.84rem;
    background: rgba(0, 0, 0, 0.55);
  }
  .yt-controls { display: flex; gap: 6px; align-items: center; }
  #yt-player-wrap { width: 100%; height: 215px; background: #000; }

  /* Settings Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 16, 0.88);
    backdrop-filter: blur(8px);
    display: none;
    place-items: center;
    z-index: 30;
    padding: 14px;
  }
  .modal-backdrop.open { display: grid; }
  .modal {
    width: 100%;
    max-width: 520px;
    max-height: 90dvh;
    overflow-y: auto;
    background: #0a1428;
    border: 1px solid var(--primary);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.28);
  }
  .modal h2 { font-size: 1.15rem; color: var(--primary); margin-bottom: 12px; }
  .field { margin-bottom: 11px; }
  .field label { display: block; font-size: 0.82rem; margin-bottom: 4px; color: #b8dcff; }
  .field input, .field textarea {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    color: #fff;
    font-size: 0.9rem;
  }
  .field textarea { min-height: 84px; resize: vertical; }
  .check-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 0.88rem; }
  .check-row input { width: 18px; height: 18px; accent-color: var(--primary); }
  .modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; font-weight: 600; font-size: 0.88rem; }
  .btn-primary { background: var(--primary); color: #03101f; border: none; }
  .btn-ghost { background: transparent; color: var(--text); }
</style>
</head>
<body class="state-standby">

  <div class="chat-box" id="chatBox">

<!-- Load YouTube IFrame Player API for real volume & playback control -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const STORAGE_KEY = 'jarvis_config_v4';
const DEFAULT_FAVS = [
  'खाटू श्याम जी मंगला आरती | https://www.youtube.com/watch?v=GlyOxMcwt_o',
  'हनुमान चालीसा | https://www.youtube.com/watch?v=AETFvQonfV8',
  'गायत्री मंत्र | https://www.youtube.com/watch?v=Sarl_5g5xP8',
  'ओम जय जगदीश हरे आरती | https://www.youtube.com/watch?v=3ucCEjXS9n8'
].join('\n');

let cfg = {
  handsfree: true,
  key: '',
  ytKey: '',
  model: 'gemini-2.0-flash',
  userName: 'मम्मी जी',
  contacts: '',
  favs: DEFAULT_FAVS,
  autoStart: ''
};

let isAwake = false;
let awakeTimer = null;
let isSpeaking = false;
let isProcessing = false;
let recognition = null;
let restartTimeout = null;
let activeTimers = [];
let openedTabs = [];
let ytPlayer = null;
let ytReady = false;
let pendingVideo = null;
let currentFavIndex = 0;
let speechVol = 1.0;

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-player', {
    height: '215',
    width: '100%',
    videoId: 'GlyOxMcwt_o',
    playerVars: { autoplay: 0, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => {
        ytReady = true;
        if (pendingVideo) {
          ytPlayer.loadVideoById(pendingVideo);
          pendingVideo = null;
        }
      }
    }
  });
}

function loadCfg() {
  try {
    // Migrate old v3 keys if v4 not found
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(localStorage.getItem('jarvis_config_v3'));
    if (saved) cfg = { ...cfg, ...saved };
  } catch (e) {}

  if (!cfg.model || cfg.model === 'gemini-2.5-flash') cfg.model = 'gemini-2.0-flash';
  if (!cfg.favs || !cfg.favs.includes('GlyOxMcwt_o')) {
    cfg.favs = DEFAULT_FAVS + (cfg.favs ? '\n' + cfg.favs : '');
  }

  document.getElementById('s_handsfree').checked = cfg.handsfree !== false;
  document.getElementById('s_key').value = cfg.key || '';
  document.getElementById('s_ytkey').value = cfg.ytKey || '';
  document.getElementById('s_model').value = cfg.model;
  document.getElementById('s_name').value = cfg.userName || 'मम्मी जी';
  document.getElementById('s_contacts').value = cfg.contacts || '';
  document.getElementById('s_favs').value = cfg.favs;
  document.getElementById('s_start').value = cfg.autoStart || '';
}

function saveCfg() {
  cfg.handsfree = document.getElementById('s_handsfree').checked;
  cfg.key = document.getElementById('s_key').value.trim();
  cfg.ytKey = document.getElementById('s_ytkey').value.trim();
  cfg.model = document.getElementById('s_model').value.trim() || 'gemini-2.0-flash';
  cfg.userName = document.getElementById('s_name').value.trim() || 'मम्मी जी';
  cfg.contacts = document.getElementById('s_contacts').value.trim();
  cfg.favs = document.getElementById('s_favs').value.trim() || DEFAULT_FAVS;
  cfg.autoStart = document.getElementById('s_start').value.trim();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  document.getElementById('settingsModal').classList.remove('open');
  const msg = `नमस्ते ${cfg.userName}, आपकी सारी सेटिंग्स सेव हो गई हैं।`;
  addMsg('ai', msg);
  speak(msg);
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('dateStr').textContent = now.toLocaleDateString('hi-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
setInterval(updateClock, 1000);
updateClock();

function setState(state, customText) {
  document.body.className = `state-${state}`;
  const pill = document.getElementById('statusPill');
  if (customText) {
    pill.textContent = customText;
    return;
  }
  if (state === 'listening') {
    pill.textContent = isAwake ? '🟢 सुन रहा हूँ... बोलिए' : '🙏 STANDBY • "JARVIS" बोलें';
  } else if (state === 'thinking') {
    pill.textContent = '🟡 समझ रहा हूँ...';
  } else if (state === 'speaking') {
    pill.textContent = '🟣 बोल रहा हूँ...';
  } else {
    pill.textContent = cfg.handsfree ? '🙏 STANDBY • "JARVIS" बोलें' : 'Avatar पर टैप करके बोलें';
  }
}

function addMsg(role, text) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = role === 'user' ? 'msg-user' : 'msg-ai';
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// Natural Hindi Female/Male Voice Selector + Speech
function speak(text, onDone) {
  window.speechSynthesis.cancel();
  if (!text) { if (onDone) onDone(); return; }
  isSpeaking = true;
  setState('speaking');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'hi-IN';
  utter.volume = speechVol;
  utter.rate = 1.0;

  const voices = window.speechSynthesis.getVoices();
  const hiVoice = voices.find(v => v.lang.includes('hi') && v.name.includes('Google')) || voices.find(v => v.lang.includes('hi'));
  if (hiVoice) utter.voice = hiVoice;

  utter.onend = () => {
    isSpeaking = false;
    setState('standby');
    if (onDone) onDone();
    else if (cfg.handsfree) scheduleRestart(350);
  };
  utter.onerror = () => {
    isSpeaking = false;
    setState('standby');
    if (onDone) onDone();
    else if (cfg.handsfree) scheduleRestart(350);
  };
  window.speechSynthesis.speak(utter);
}

function doNamasteGreeting() {
  const hour = new Date().getHours();
  const timeGreet = hour < 12 ? 'सुप्रभात' : hour < 17 ? 'नमस्कार' : 'शुभ संध्या';
  const greeting = `🙏 ${timeGreet} ${cfg.userName}! मैं जार्विस आपकी सेवा में हाज़िर हूँ। बताइए क्या आदेश है?`;
  document.getElementById('namasteBadge').textContent = `🙏 नमस्ते ${cfg.userName}`;
  addMsg('ai', greeting);
  speak(greeting, () => {
    startListening(true);
  });
}

function activateAwakeWindow() {
  isAwake = true;
  setState('listening', '🟢 सुन रहा हूँ... बोलिए');
  clearTimeout(awakeTimer);
  awakeTimer = setTimeout(() => {
    isAwake = false;
    if (!isProcessing && !isSpeaking) setState(cfg.handsfree ? 'listening' : 'standby');
  }, 14000);
}

function extractWakeCommand(rawText) {
  const text = rawText.trim();
  const wakeRegex = /^(?:hey\s+|हे\s+|ओके\s+|ok\s+|अरे\s+)?(?:jarvis|जार्विस|जारविस|जाविश|जर्विस|सर्विस)[\s,।!?-]*(.*)$/i;
  const match = text.match(wakeRegex);
  if (match) return { triggered: true, command: (match[1] || '').trim() };
  return { triggered: false, command: text };
}

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setState('standby', 'इस ब्राउज़र में Voice उपलब्ध नहीं है');
    return;
  }
  recognition = new SR();
  recognition.lang = 'hi-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    if (!isProcessing && !isSpeaking) setState('listening');
  };

  recognition.onresult = async (event) => {
    const transcript = event.results[event.results.length - 1][0].transcript.trim();
    if (!transcript || isSpeaking) return;

    if (!cfg.handsfree || isAwake) {
      clearTimeout(awakeTimer);
      isAwake = false;
      const cleaned = extractWakeCommand(transcript);
      const finalCmd = cleaned.triggered && cleaned.command ? cleaned.command : transcript;
      await handleUserCommand(finalCmd);
    } else {
      const { triggered, command } = extractWakeCommand(transcript);
      if (triggered) {
        if (command) {
          await handleUserCommand(command);
        } else {
          activateAwakeWindow();
          speak(`जी ${cfg.userName}, बोलिए...`, () => {
            activateAwakeWindow();
            scheduleRestart(250);
          });
        }
      }
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') {
      cfg.handsfree = false;
      setState('standby', 'माइक की अनुमति (Mic Permission) दें');
      return;
    }
    if (cfg.handsfree && !isProcessing && !isSpeaking) scheduleRestart(500);
  };

  recognition.onend = () => {
    if (cfg.handsfree && !isProcessing && !isSpeaking) scheduleRestart(350);
    else if (!cfg.handsfree && !isProcessing && !isSpeaking) setState('standby');
  };
}

function scheduleRestart(delay = 350) {
  clearTimeout(restartTimeout);
  restartTimeout = setTimeout(() => startListening(false), delay);
}

function startListening(forceAwake = false) {
  if (!recognition) initRecognition();
  if (!recognition || isProcessing || isSpeaking) return;
  if (forceAwake) activateAwakeWindow();
  try { recognition.start(); } catch (e) {}
}

// Media & Volume Helpers
function extractVideoId(str) {
  const m = str.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  if (/^[A-Za-z0-9_-]{11}$/.test(str.trim())) return str.trim();
  return null;
}

function playVideoEmbed(videoId, title) {
  const container = document.getElementById('yt-container');
  document.getElementById('yt-title').textContent = `▶ ${title}`;
  container.style.display = 'block';
  if (ytReady && ytPlayer && ytPlayer.loadVideoById) {
    ytPlayer.loadVideoById(videoId);
    ytPlayer.unMute();
  } else {
    pendingVideo = videoId;
  }
}

function closePlayer() {
  if (ytReady && ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
  document.getElementById('yt-container').style.display = 'none';
}

function changeVolume(delta) {
  speechVol = Math.min(1, Math.max(0.1, speechVol + delta / 100));
  if (ytReady && ytPlayer && ytPlayer.getVolume) {
    ytPlayer.unMute();
    const cur = ytPlayer.getVolume();
    const next = Math.min(100, Math.max(5, cur + delta));
    ytPlayer.setVolume(next);
    return next;
  }
  return Math.round(speechVol * 100);
}

function getSavedAartiList() {
  return (cfg.favs || DEFAULT_FAVS).split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const [name, link] = line.split('|').map(s => s.trim());
    return { name, link, id: extractVideoId(link || '') };
  }).filter(item => item.name && item.id);
}

async function toolPlayMedia(query, playNext = false) {
  const list = getSavedAartiList();

  // If user asked for "dusri aarti" / next aarti
  if (playNext && list.length > 0) {
    currentFavIndex = (currentFavIndex + 1) % list.length;
    const item = list[currentFavIndex];
    playVideoEmbed(item.id, item.name);
    return `${item.name} चला रहा हूँ।`;
  }

  const qLower = query.toLowerCase();
  for (let i = 0; i < list.length; i++) {
    const item = list[i];
    if (qLower.includes(item.name.toLowerCase()) || item.name.toLowerCase().includes(qLower) ||
        (qLower.includes('मंगला') && item.name.includes('मंगला'))) {
      currentFavIndex = i;
      playVideoEmbed(item.id, item.name);
      return `${item.name} चला रहा हूँ।`;
    }
  }

  // Try YouTube Data API v3 if key exists
  if (cfg.ytKey) {
    try {
      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&q=${encodeURIComponent(query)}&key=${encodeURIComponent(cfg.ytKey)}`;
      const res = await fetch(url);
      const data = await res.json();
      const item = data.items && data.items[0];
      if (item && item.id && item.id.videoId) {
        playVideoEmbed(item.id.videoId, item.snippet.title || query);
        return `YouTube पर ${query} चला दिया है।`;
      }
    } catch (e) {}
  }

  // Guaranteed fallback: open YouTube search tab
  const win = window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, '_blank');
  if (win) openedTabs.push(win);
  return `YouTube पर ${query} खोल दिया है।`;
}

function toolOpenWebsite(site) {
  const s = site.toLowerCase().trim();
  const map = {
    gmail: 'https://mail.google.com',
    mail: 'https://mail.google.com',
    maps: 'https://maps.google.com',
    whatsapp: 'https://web.whatsapp.com',
    youtube: 'https://www.youtube.com',
    google: 'https://www.google.com'
  };
  let target = map[s] || (s.startsWith('http') ? s : `https://${s.includes('.') ? s : s + '.com'}`);
  const win = window.open(target, '_blank');
  if (win) openedTabs.push(win);
  return `${site} खोल दिया है।`;
}

function toolCloseTabsAndShutdown(doShutdown = false) {
  // Close all tabs opened by Jarvis + stop media
  closePlayer();

function toolSendWhatsApp(recipient, message) {
  const lines = (cfg.contacts || '').split('\n').map(l => l.trim()).filter(Boolean);
  let phone = recipient.replace(/\D/g, '');
  let matchedName = recipient;

  if (phone.length < 10) {
    phone = '';
    for (const line of lines) {
      const [name, num] = line.split('|').map(s => s.trim());
      if (name && num && name.toLowerCase().includes(recipient.toLowerCase())) {
        phone = num.replace(/\D/g, '');
        matchedName = name;
        break;
      }
    }
  }
  if (!phone) return `${recipient} का नंबर कॉन्टैक्ट्स में नहीं मिला। कृपया सेटिंग्स में नंबर जोड़ें।`;
  if (phone.length === 10) phone = '91' + phone;
  const win = window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
  if (win) openedTabs.push(win);
  return `${matchedName} के लिए WhatsApp मैसेज तैयार कर दिया है, बस Send दबा दें।`;
}

function addTimerBadge(label, timeoutId) {
  const id = Date.now() + Math.random();
  activeTimers.push({ id, label, timeoutId });
  renderBadges();
  return id;
}
function removeTimerBadge(id) {
  const idx = activeTimers.findIndex(t => t.id === id);
  if (idx !== -1) { clearTimeout(activeTimers[idx].timeoutId); activeTimers.splice(idx, 1); renderBadges(); }
}
function renderBadges() {
  const wrap = document.getElementById('badgesWrap');
  wrap.innerHTML = '';
  activeTimers.forEach(t => {
    const el = document.createElement('div');
    el.className = 'timer-badge';
    el.innerHTML = `⏰ ${t.label} <button onclick="removeTimerBadge(${t.id})">✕</button>`;
    wrap.appendChild(el);
  });
}
function toolSetTimer(minutes, label = 'टाइमर') {
  const ms = Math.max(1, Number(minutes)) * 60000;
  let badgeId;
  const tid = setTimeout(() => {
    removeTimerBadge(badgeId);
    const alertMsg = `${cfg.userName}, आपका ${minutes} मिनट का ${label} पूरा हो गया है!`;
    addMsg('ai', alertMsg);
    speak(alertMsg);
  }, ms);
  badgeId = addTimerBadge(`${minutes} मिनट (${label})`, tid);
  return `${minutes} मिनट का ${label} लगा दिया है।`;
}
function toolSetReminder(time24, message) {
  const [hh, mm] = time24.split(':').map(Number);
  if (isNaN(hh) || isNaN(mm)) return 'समय समझ नहीं आया, कृपया दोबारा बोलें।';
  const now = new Date();
  const target = new Date();
  target.setHours(hh, mm, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  let badgeId;
  const tid = setTimeout(() => {
    removeTimerBadge(badgeId);
    const alertMsg = `${cfg.userName}, याद दिलाने का समय हो गया है: ${message}`;
    addMsg('ai', alertMsg);
    speak(alertMsg);
  }, target - now);
  badgeId = addTimerBadge(`${time24} - ${message}`, tid);
  return `${time24} बजे के लिए "${message}" का रिमाइंडर लगा दिया है।`;
}

// Instant Local Commands (100% Reliable even without Gemini API)
async function tryLocalCommand(text) {
  const t = text.toLowerCase().trim();

  // Namaste
  if (/^(?:नमस्ते|नमस्कार|hello|hi|प्रणाम)/.test(t)) {
    const hour = new Date().getHours();
    const g = hour < 12 ? 'सुप्रभात' : hour < 17 ? 'नमस्कार' : 'शुभ संध्या';
    return `🙏 ${g} ${cfg.userName}! बताइए मैं आपकी क्या सहायता करूँ?`;
  }

  // Volume Control
  if (/(?:आवाज़|साउंड|वॉल्यूम|sound|volume)/.test(t)) {
    if (/(?:तेज़|बढ़ा|ज्यादा|ऊँची|high|up|increase)/.test(t)) {
      const v = changeVolume(25);
      return `आवाज़ बढ़ाकर ${v} प्रतिशत कर दी है।`;
    }
    if (/(?:कम|धीमी|घटा|नीचे|low|down|decrease)/.test(t)) {
      const v = changeVolume(-25);
      return `आवाज़ कम करके ${v} प्रतिशत कर दी है।`;
    }
    if (/(?:म्यूट|बंद|mute)/.test(t)) {
      if (ytReady && ytPlayer && ytPlayer.mute) ytPlayer.mute();
      return 'आवाज़ म्यूट कर दी है।';
    }
  }

  // Close Tabs / Shutdown
  if (/(?:शटडाउन|शट डाउन|shut\s*down|बंद करो|लैपटॉप बंद)/.test(t)) {
    if (/(?:शटडाउन|शट डाउन|shut\s*down|लैपटॉप बंद|कंप्यूटर बंद)/.test(t)) {
      return toolCloseTabsAndShutdown(true);
    }
    if (/(?:टैब|tab|सब बंद|सारे बंद|आरती बंद|गाना बंद)/.test(t)) {
      return toolCloseTabsAndShutdown(false);
    }
  }

  // Next / Another Aarti
  if (/(?:दूसरी आरती|अगली आरती|कोई और आरती|next aarti|change aarti|दूसरा भजन)/.test(t)) {
    return await toolPlayMedia('', true);
  }

  // Direct Aarti / Bhajan Play Command
  if (/(?:आरती|चालीसा|मंत्र|भजन|लगाओ|बजाओ|चलाओ|play)/.test(t)) {
    const cleanQuery = t.replace(/(?:जार्विस|jarvis|लगाओ|बजाओ|चलाओ|सुनाओ|play|please)/gi, '').trim();
    if (cleanQuery.length >= 3) {
      return await toolPlayMedia(cleanQuery, false);
    }
  }

  // Time & Date
  if (/(?:टाइम|समय|कितने बजे|time)/.test(t) && t.length < 35) {
    const timeStr = new Date().toLocaleTimeString('hi-IN', { hour: 'numeric', minute: '2-digit' });
    return `${cfg.userName}, अभी ${timeStr} हो रहे हैं।`;
  }
  if (/(?:तारीख|आज कौन सा दिन|आज क्या वार|date|today)/.test(t) && t.length < 35) {
    const dateStr = new Date().toLocaleDateString('hi-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return `आज ${dateStr} है।`;
  }

  // Quick Websites
  if (/(?:खोलो|ओपन|open)/.test(t)) {
    if (t.includes('gmail') || t.includes('जीमेल')) return toolOpenWebsite('gmail');
    if (t.includes('maps') || t.includes('मैप्स')) return toolOpenWebsite('maps');
    if (t.includes('whatsapp') || t.includes('व्हाट्सएप')) return toolOpenWebsite('whatsapp');
    if (t.includes('youtube') || t.includes('यूट्यूब')) return toolOpenWebsite('youtube');
  }

  return null;
}

// Gemini Request with Model Auto-Fallback
async function callGeminiWithFallback(payload) {
  const models = Array.from(new Set([cfg.model, 'gemini-2.0-flash', 'gemini-flash-latest', 'gemini-1.5-flash'].filter(Boolean)));
  let lastError = 'API error';

  for (const m of models) {
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent?key=${encodeURIComponent(cfg.key)}`;
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok && data?.candidates?.[0]?.content?.parts) {
        if (cfg.model !== m) {
          cfg.model = m;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
        }
        return { ok: true, data };
      }
      lastError = data?.error?.message || `HTTP ${res.status}`;
      if (res.status === 400 && /API key not valid/i.test(lastError)) {
        return { ok: false, error: 'Gemini API Key अमान्य है। कृपया ⚙ सेटिंग्स में सही Key डालें।' };
      }
    } catch (e) {
      lastError = e.message;
    }
  }
  return { ok: false, error: lastError };
}

async function handleUserCommand(userText) {
  addMsg('user', userText);

  // 1. Instant Local Execution First
  const localReply = await tryLocalCommand(userText);
  if (localReply) {
    addMsg('ai', localReply);
    speak(localReply);
    return;
  }

  if (!cfg.key) {
    const err = 'कृपया ऊपर दाईं ओर ⚙ सेटिंग्स में जाकर अपनी Gemini API Key डालें, ताकि मैं हर सवाल का जवाब दे सकूँ।';
    addMsg('ai', err);
    speak(err);
    return;
  }

  isProcessing = true;
  setState('thinking');

  const sysPrompt = `आप J.A.R.V.I.S. हैं। उपयोगकर्ता को "${cfg.userName}" कहकर सम्मान से संबोधित करें। हमेशा सरल, स्पष्ट हिंदी (देवनागरी) में संक्षिप्त (1-3 वाक्य) जवाब दें। वर्तमान समय: ${new Date().toLocaleString('hi-IN')}। WhatsApp मैसेज के लिए send_whatsapp, टाइमर के लिए set_timer, रिमाइंडर के लिए set_reminder (HH:MM 24-hour), वेबसाइट खोलने के लिए open_website, और भजन/गाने के लिए play_media का उपयोग करें।`;

  const functionTools = [{
    function_declarations: [
      { name: 'play_media', description: 'Play an aarti, bhajan, or song', parameters: { type: 'OBJECT', properties: { query: { type: 'STRING' } }, required: ['query'] } },
      { name: 'open_website', description: 'Open website or URL', parameters: { type: 'OBJECT', properties: { site: { type: 'STRING' } }, required: ['site'] } },
      { name: 'send_whatsapp', description: 'Send WhatsApp message', parameters: { type: 'OBJECT', properties: { recipient: { type: 'STRING' }, message: { type: 'STRING' } }, required: ['recipient', 'message'] } },
      { name: 'set_timer', description: 'Set countdown timer in minutes', parameters: { type: 'OBJECT', properties: { minutes: { type: 'NUMBER' }, label: { type: 'STRING' } }, required: ['minutes'] } },
      { name: 'set_reminder', description: 'Set reminder at 24h time HH:MM', parameters: { type: 'OBJECT', properties: { time24: { type: 'STRING' }, message: { type: 'STRING' } }, required: ['time24', 'message'] } }
    ]
  }];

  try {
    const needsLiveSearch = /(?:मौसम|weather|खबर|news|समाचार|स्कोर|score|मैच|भाव|price|रेट|सोना|चांदी)/i.test(userText);
    const primaryRes = await callGeminiWithFallback({
      system_instruction: { parts: [{ text: sysPrompt }] },
      contents: [{ role: 'user', parts: [{ text: userText }] }],
      tools: needsLiveSearch ? [{ google_search: {} }] : functionTools
    });

    if (!primaryRes.ok) {
      isProcessing = false;
      const errMsg = `त्रुटि: ${primaryRes.error}`;
      addMsg('ai', errMsg);
      speak('माफ़ कीजिए, कनेक्शन में त्रुटि आई है।');
      return;
    }

    const parts = primaryRes.data?.candidates?.[0]?.content?.parts || [];
    const fnCall = parts.find(p => p.functionCall)?.functionCall;
    let replyText = '';

    if (fnCall) {
      const args = fnCall.args || {};
      if (fnCall.name === 'play_media') replyText = await toolPlayMedia(args.query);
      else if (fnCall.name === 'open_website') replyText = toolOpenWebsite(args.site);
      else if (fnCall.name === 'send_whatsapp') replyText = toolSendWhatsApp(args.recipient, args.message);
      else if (fnCall.name === 'set_timer') replyText = toolSetTimer(args.minutes, args.label || 'टाइमर');
      else if (fnCall.name === 'set_reminder') replyText = toolSetReminder(args.time24, args.message);
    } else {
      replyText = parts.map(p => p.text || '').join(' ').trim();
    }

    isProcessing = false;
    const finalOut = replyText || 'माफ़ कीजिए, मैं अभी इसका उत्तर नहीं ला पाया।';
    addMsg('ai', finalOut);
    speak(finalOut);
  } catch (err) {
    isProcessing = false;
    addMsg('ai', `नेटवर्क त्रुटि: ${err.message}`);
    speak('नेटवर्क में समस्या आ रही है।');
  }
}

// UI Events
document.getElementById('reactorBtn').addEventListener('click', () => {
  window.speechSynthesis.cancel();
  isSpeaking = false;
  startListening(true);
});

document.getElementById('btnNamaste').addEventListener('click', doNamasteGreeting);

document.getElementById('btnStopAll').addEventListener('click', () => {
  window.speechSynthesis.cancel();
  isSpeaking = false;
  isAwake = false;
  closePlayer();
  setState(cfg.handsfree ? 'listening' : 'standby');
  if (cfg.handsfree) scheduleRestart(300);
});

document.getElementById('btnSettings').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.add('open');
});
document.getElementById('btnCloseSettings').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.remove('open');
});
document.getElementById('btnSaveSettings').addEventListener('click', saveCfg);

window.addEventListener('DOMContentLoaded', async () => {
  loadCfg();
  if (cfg.autoStart) {
    const msg = await toolPlayMedia(cfg.autoStart);
    addMsg('ai', msg);
  }
  if (cfg.handsfree) startListening(false);
});
</script>
</body>
</html>
