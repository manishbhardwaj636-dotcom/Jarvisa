<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Interactive AI Avatar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body {
    background: radial-gradient(circle at center, #121a2b 0%, #060911 100%);
    color: #e0f7ff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    overflow: hidden;
  }

  /* HUD Header */
  .hud-header {
    width: 100%;
    max-width: 680px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(0, 229, 255, 0.3);
    padding-bottom: 10px;
    font-size: 13px;
    letter-spacing: 1.2px;
    color: #00e5ff;
  }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: #00ffaa;
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 8px #00ffaa;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .icon-btn {
    background: rgba(0, 229, 255, 0.12);
    border: 1px solid rgba(0, 229, 255, 0.4);
    color: #00e5ff;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
  }
  .icon-btn:hover { background: rgba(0, 229, 255, 0.28); }

  /* Robot Stage */
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
  }

  /* Iron Man HUD Ring behind robot */
  .hud-ring {
    position: absolute;
    width: 310px;
    height: 310px;
    border: 2px dashed rgba(0, 229, 255, 0.25);
    border-radius: 50%;
    animation: spin 18s linear infinite;
    pointer-events: none;
    transition: all 0.4s ease;
  }
  .hud-ring.active {
    border-color: #00e5ff;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.4), inset 0 0 30px rgba(0, 229, 255, 0.2);
    animation: spin 4s linear infinite;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* Robot Container */
  .robot {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: float 3s ease-in-out infinite;
    cursor: pointer;
    z-index: 2;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
  }
  .robot.dancing { animation: dance 0.6s ease-in-out infinite; }
  @keyframes dance {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-18px) rotate(6deg); }
  }

  /* Head */
  .head {
    position: relative;
    width: 170px;
    height: 130px;
    background: radial-gradient(circle at 30% 25%, #ffffff, #d9e2ec);
    border-radius: 65px 65px 55px 55px;
    box-shadow: inset -8px -10px 20px rgba(0,0,0,0.18), 0 10px 25px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }

  /* Glowing Ears */
  .ear {
    position: absolute;
    width: 16px;
    height: 46px;
    background: #eef4fa;
    border-radius: 10px;
    box-shadow: 0 0 12px #00e5ff;
    border: 2px solid #00e5ff;
  }
  .ear.left { left: -10px; }
  .ear.right { right: -10px; }

  /* Black Glossy Visor */
  .visor {
    width: 136px;
    height: 88px;
    background: linear-gradient(145deg, #0a0f1c, #182238);
    border-radius: 42px;
    box-shadow: inset 0 4px 12px rgba(255,255,255,0.15), 0 0 10px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    position: relative;
    overflow: hidden;
  }

  /* LED Eyes */
  .eye {
    width: 30px;
    height: 18px;
    border-top: 6px solid #00e5ff;
    border-radius: 50% 50% 0 0;
    filter: drop-shadow(0 0 8px #a855f7);
    transition: all 0.25s ease;
  }
  .robot.listening .eye {
    height: 28px;
    border-radius: 50%;
    border: 5px solid #00ffaa;
    filter: drop-shadow(0 0 12px #00ffaa);
  }
  .robot.speaking .eye {
    animation: talkPulse 0.25s infinite alternate;
  }
  @keyframes talkPulse {
    from { transform: scaleY(0.7); border-color: #00e5ff; }
    to { transform: scaleY(1.2); border-color: #c084fc; }
  }
  .robot.ironman .eye {
    height: 10px;
    width: 34px;
    border-radius: 4px;
    background: #00e5ff;
    border: none;
    box-shadow: 0 0 16px #00e5ff;
  }

  /* Neck Glow */
  .neck {
    width: 70px;
    height: 10px;
    background: #00e5ff;
    border-radius: 10px;
    margin-top: -4px;
    box-shadow: 0 0 15px #00e5ff;
    z-index: 2;
  }

  /* Torso */
  .body-wrap {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    margin-top: -2px;
  }
  .torso {
    width: 120px;
    height: 115px;
    background: radial-gradient(circle at 35% 30%, #ffffff, #cfd9e5);
    border-radius: 45px 45px 50px 50px;
    box-shadow: inset -8px -10px 18px rgba(0,0,0,0.18), 0 15px 30px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  /* Arc Reactor */
  .arc-reactor {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(0, 229, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.4s ease;
  }
  .arc-core {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(0, 229, 255, 0.2);
    transition: all 0.4s ease;
  }
  .robot.ironman .arc-reactor {
    border-color: #00e5ff;
    box-shadow: 0 0 20px #00e5ff, inset 0 0 10px #00e5ff;
  }
  .robot.ironman .arc-core {
    background: #ffffff;
    box-shadow: 0 0 15px #00e5ff;
  }

  /* Arms */
  .arm {
    position: absolute;
    width: 34px;
    height: 76px;
    background: radial-gradient(circle at 30% 30%, #ffffff, #d2dce8);
    border-radius: 20px;
    top: 12px;
    box-shadow: inset -4px -6px 10px rgba(0,0,0,0.15);
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 10px;
    transition: transform 0.4s ease;
  }
  .arm::after {
    content: "";
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2.5px solid #00e5ff;
    box-shadow: 0 0 8px #00e5ff;
  }
  .arm.left { left: -28px; transform: rotate(22deg); transform-origin: top center; }
  .arm.right { right: -28px; transform: rotate(-22deg); transform-origin: top center; }
  .robot.waving .arm.right { animation: waveHand 0.5s ease-in-out 4; }
  @keyframes waveHand {
    0%, 100% { transform: rotate(-130deg); }
    50% { transform: rotate(-155deg); }
  }

  /* Legs */
  .legs {
    display: flex;
    gap: 20px;
    margin-top: -12px;
    z-index: 1;
  }
  .leg {
    width: 36px;
    height: 40px;
    background: radial-gradient(circle at 30% 30%, #f5f9fc, #c5d1e0);
    border-radius: 14px 14px 18px 18px;
  }

  /* Live Hearing Strip */
  .heard-strip {
    margin-top: 14px;
    font-size: 12px;
    color: #00ffaa;
    min-height: 18px;
    text-align: center;
  }

  /* Speech Bubble */
  .speech-box {
    margin-top: 8px;
    max-width: 560px;
    width: 100%;
    min-height: 54px;
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.35);
    border-radius: 14px;
    padding: 12px 18px;
    text-align: center;
    font-size: 15px;
    line-height: 1.45;
    color: #d8f8ff;
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
  }

  /* Quick Action Chips */
  .quick-chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    max-width: 600px;
  }
  .chip {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(0, 229, 255, 0.35);
    color: #a5f3fc;
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
  }
  .chip:hover { background: rgba(0, 229, 255, 0.2); }

  /* Controls */
  .controls {
    width: 100%;
    max-width: 640px;
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  input[type="text"], input[type="password"] {
    flex: 1;
    padding: 12px 16px;
    border-radius: 25px;
    border: 1px solid rgba(0, 229, 255, 0.4);
    background: rgba(15, 23, 42, 0.85);
    color: #fff;
    outline: none;
    font-size: 14px;
  }
  .action-btn {
    padding: 12px 18px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .mic-btn.active {
    background: linear-gradient(135deg, #00c853, #009624);
    box-shadow: 0 0 15px rgba(0, 200, 83, 0.7);
  }

  /* Settings Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 9, 17, 0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: #0f172a;
    border: 1px solid #00e5ff;
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.25);
  }
  .modal-card label { font-size: 12px; color: #7dd3fc; display: block; margin-bottom: 4px; }
  .modal-card input[type="text"], .modal-card input[type="password"] { width: 100%; border-radius: 10px; padding: 10px; }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #e2e8f0; cursor: pointer; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
</style>
</head>
<body>

  <div class="hud-header">
    <div><span class="status-dot"></span>J.A.R.V.I.S. MK-1</div>
    <div class="header-right">
      <span id="modeLabel">STANDBY</span>
      <button class="icon-btn" onclick="openSettings()">⚙ Settings</button>
    </div>
  </div>

  <div class="stage">
    <div class="hud-ring" id="hudRing"></div>

    <div class="robot" id="robot" onclick="waveAndGreet()">
      <div class="head">
        <div class="ear left"></div>
        <div class="visor">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="ear right"></div>
      </div>
      <div class="neck"></div>
      <div class="body-wrap">
        <div class="arm left"></div>
        <div class="torso">
          <div class="arc-reactor"><div class="arc-core"></div></div>
        </div>
        <div class="arm right"></div>
      </div>
      <div class="legs">
        <div class="leg"></div>
        <div class="leg"></div>
      </div>
    </div>

    <div class="heard-strip" id="heardStrip"></div>

    <div class="speech-box" id="speechBox">
      नमस्ते! मैं जार्विस हूँ। बात करने के लिए <b>Mic Start</b> दबाएं या नीचे लिखें।
    </div>

    <div class="quick-chips">
      <button class="chip" onclick="processCommand('morning aarti chalao')">🌅 Morning Aarti</button>
      <button class="chip" onclick="processCommand('youtube par hanuman chalisa lagao')">▶ Hanuman Chalisa</button>
      <button class="chip" onclick="processCommand('iron man mode')">⚡ Iron Man Mode</button>
      <button class="chip" onclick="processCommand('calculator kholo')">🧮 Open Calculator</button>
    </div>
  </div>

  <div class="controls">
    <button id="micBtn" class="action-btn mic-btn" onclick="toggleMic()">🎤 Mic Start</button>
    <input type="text" id="textInput" placeholder="Boliye ya likhein (e.g., Jarvis bhajan chalao, time kya hai)..." onkeypress="if(event.key==='Enter') sendText()">
    <button class="action-btn" onclick="sendText()">Send</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-card">
      <h3 style="color:#00e5ff;">⚙ JARVIS Settings</h3>
      <div>
        <label>Gemini API Key (AIzaSy...)</label>
        <input type="password" id="inpApiKey" placeholder="Paste Gemini API Key here">
      </div>
      <div>
        <label>Morning Aarti / Playlist Link</label>
        <input type="text" id="inpMorningUrl" placeholder="https://www.instagram.com/reel/...">
      </div>
      <label class="check-row">
        <input type="checkbox" id="chkWakeWord">
        <span>Sirf "Jarvis" bolne par jawab de (Wake Word)</span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="chkContinuous">
        <span>Continuous Hands-Free Mic (Baar-baar dabana na pade)</span>
      </label>
      <div class="modal-actions">
        <button class="icon-btn" onclick="closeSettings()">Cancel</button>
        <button class="action-btn" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

<script>
  const DEFAULT_AARTI_URL = "https://www.instagram.com/reel/DYt-oFbM4ea/?gwpx=MmtmbmMyemZ6dnMz";
  const PC_BRIDGE_URL = "http://127.0.0.1:5050/run";

  let config = {
    apiKey: localStorage.getItem('jarvis_api_key') || "",
    morningUrl: localStorage.getItem('jarvis_morning_url') || DEFAULT_AARTI_URL,
    wakeWord: localStorage.getItem('jarvis_wake_word') === 'true', // default false so it replies immediately when mic is clicked
    continuous: localStorage.getItem('jarvis_continuous') !== 'false'
  };

  const robot = document.getElementById('robot');
  const speechBox = document.getElementById('speechBox');
  const heardStrip = document.getElementById('heardStrip');
  const hudRing = document.getElementById('hudRing');
  const modeLabel = document.getElementById('modeLabel');
  const micBtn = document.getElementById('micBtn');
  const textInput = document.getElementById('textInput');

  let chatHistory = [
    {
      role: "user",
      parts: [{ text: "Tum J.A.R.V.I.S. ho, ek smart aur vinamra AI assistant. Hamesha chhote, spasht (1-2 line) aur natural Hindi (Devanagari) ya Hinglish mein jawab do. Markdown symbols (*, #) mat use karna." }]
    },
    {
      role: "model",
      parts: [{ text: "जी बिल्कुल, मैं तैयार हूँ।" }]
    }
  ];

  // Settings Modal Functions
  function openSettings() {
    document.getElementById('inpApiKey').value = config.apiKey;
    document.getElementById('inpMorningUrl').value = config.morningUrl;
    document.getElementById('chkWakeWord').checked = config.wakeWord;
    document.getElementById('chkContinuous').checked = config.continuous;
    document.getElementById('settingsModal').classList.add('open');
  }
  function closeSettings() {
    document.getElementById('settingsModal').classList.remove('open');
  }
  function saveSettings() {
    config.apiKey = document.getElementById('inpApiKey').value.trim();
    config.morningUrl = document.getElementById('inpMorningUrl').value.trim() || DEFAULT_AARTI_URL;
    config.wakeWord = document.getElementById('chkWakeWord').checked;
    config.continuous = document.getElementById('chkContinuous').checked;

    localStorage.setItem('jarvis_api_key', config.apiKey);
    localStorage.setItem('jarvis_morning_url', config.morningUrl);
    localStorage.setItem('jarvis_wake_word', config.wakeWord);
    localStorage.setItem('jarvis_continuous', config.continuous);

    closeSettings();
    speak("Settings save ho gayi hain.");
  }

  // Text-to-Speech (Supports Devanagari Hindi & English)
  let isSpeaking = false;
  function speak(text) {
    const clean = text.replace(/[*#_`]/g, '').trim();
    speechBox.textContent = clean;

    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    isSpeaking = true;

    if (recognition && isListening) {
      try { recognition.stop(); } catch (e) {}
    }

    const utterance = new SpeechSynthesisUtterance(clean);
    const hasHindi = /[\u0900-\u097F]/.test(clean);
    const voices = window.speechSynthesis.getVoices();

    if (hasHindi) {
      utterance.lang = 'hi-IN';
      const hiVoice = voices.find(v => v.lang.includes('hi'));
      if (hiVoice) utterance.voice = hiVoice;
    } else {
      utterance.lang = 'en-IN';
      const enVoice = voices.find(v => v.lang.includes('en-IN') || v.lang.startsWith('en'));
      if (enVoice) utterance.voice = enVoice;
    }
    utterance.rate = 1.02;

    utterance.onstart = () => robot.classList.add('speaking');
    utterance.onend = () => {
      isSpeaking = false;
      robot.classList.remove('speaking');
      if (keepMicAlive) startRecognitionSafely();
    };
    utterance.onerror = () => {
      isSpeaking = false;
      robot.classList.remove('speaking');
      if (keepMicAlive) startRecognitionSafely();
    };

    window.speechSynthesis.speak(utterance);
  }

  function waveAndGreet() {
    robot.classList.remove('waving');
    void robot.offsetWidth;
    robot.classList.add('waving');
    speak("नमस्ते! बताइए मैं आपकी क्या सहायता कर सकता हूँ?");
  }

  // Send command to local Python PC Control server (if running)
  async function tryPCCommand(actionName) {
    try {
      const res = await fetch(PC_BRIDGE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: actionName })
      });
      const data = await res.json();
      if (data.status === 'ok') {
        speak(data.message);
        return true;
      }
    } catch (e) {
      return false; // Python script not running on PC
    }
    return false;
  }

  // Main Command Processor
  async function processCommand(rawCmd) {
    const cmd = rawCmd.toLowerCase().trim();
    if (!cmd) return;
    robot.classList.remove('dancing');

    // 1. Morning Aarti / Playlist
    if (cmd.includes('morning') || cmd.includes('aarti') || cmd.includes('आरती') || cmd.includes('सुबह') || cmd.includes('playlist')) {
      speak("सुप्रभात, सुबह की आरती चालू कर रहा हूँ।");
      window.open(config.morningUrl, '_blank');
      return;
    }

    // 2. YouTube Search / Bhajan / Song
    if (cmd.includes('youtube') || cmd.includes('यूट्यूब') || cmd.includes('bhajan') || cmd.includes('भजन') || cmd.includes('chalisa') || cmd.includes('चालीसा') || cmd.includes('gaana') || cmd.includes('song')) {
      let query = rawCmd.replace(/open|youtube|यूट्यूब|kholo|खोलो|par|पर|play|chalao|चलाओ|lagao|लगाओ|search|jarvis|जार्विस/gi, '').trim();
      const url = query ? `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}` : 'https://www.youtube.com';
      speak(query ? `यूट्यूब पर ${query} चला रहा हूँ।` : "यूट्यूब खोल रहा हूँ।");
      window.open(url, '_blank');
      return;
    }

    // 3. PC Control Commands (Calculator, Notepad, Chrome, Shutdown)
    if (cmd.includes('calculator') || cmd.includes('कैलकुलेटर')) {
      const handled = await tryPCCommand('calculator');
      if (!handled) {
        speak("कैलकुलेटर खोलने के लिए पहले लैपटॉप पर Python स्क्रिप्ट चालू करें।");
      }
      return;
    }
    if (cmd.includes('notepad') || cmd.includes('नोटपैड')) {
      const handled = await tryPCCommand('notepad');
      if (!handled) speak("नोटपैड के लिए लैपटॉप पर Python कंट्रोलर चालू करें।");
      return;
    }
    if (cmd.includes('shutdown') || cmd.includes('बंद कर दो') || cmd.includes('computer band')) {
      const handled = await tryPCCommand('shutdown');
      if (!handled) speak("लैपटॉप बंद करने के लिए Python स्क्रिप्ट चालू होनी चाहिए।");
      return;
    }

    // 4. Iron Man Mode
    if (cmd.includes('iron man') || cmd.includes('combat') || cmd.includes('power mode')) {
      robot.classList.toggle('ironman');
      hudRing.classList.toggle('active');
      const isOn = robot.classList.contains('ironman');
      modeLabel.textContent = isOn ? "IRON MAN MODE" : "STANDBY";
      speak(isOn ? "आर्क रिएक्टर ऑन! आयरन मैन मोड एक्टिवेट हो गया है।" : "आयरन मैन मोड बंद कर दिया गया है।");
      return;
    }

    // 5. Time & Date
    if (cmd.includes('time') || cmd.includes('samay') || cmd.includes('समय') || cmd.includes('बजे')) {
      const now = new Date().toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });
      speak(`अभी समय ${now} हो रहा है।`);
      return;
    }
    if (cmd.includes('date') || cmd.includes('tarikh') || cmd.includes('तारीख') || cmd.includes('दिन')) {
      const today = new Date().toLocaleDateString('hi-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      speak(`आज ${today} है।`);
      return;
    }

    // 6. Dance
    if (cmd.includes('dance') || cmd.includes('नाचो')) {
      robot.classList.add('dancing');
      modeLabel.textContent = "PARTY MODE";
      speak("चलिए, थोड़ा रोबोट डांस हो जाए!");
      setTimeout(() => {
        robot.classList.remove('dancing');
        modeLabel.textContent = "STANDBY";
      }, 4500);
      return;
    }

    // 7. Ask Gemini AI for everything else!
    askGemini(rawCmd);
  }

  async function askGemini(promptText) {
    if (!config.apiKey) {
      speak("कृपया ऊपर Settings बटन दबाकर अपनी Gemini API Key सेव करें, फिर मैं आपके हर सवाल का जवाब दे पाऊँगा।");
      openSettings();
      return;
    }

    modeLabel.textContent = "THINKING...";
    chatHistory.push({ role: "user", parts: [{ text: promptText }] });

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${config.apiKey}`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: chatHistory,
          generationConfig: { temperature: 0.7, maxOutputTokens: 180 }
        })
      });

      const data = await response.json();
      modeLabel.textContent = "STANDBY";

      if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
        const reply = data.candidates[0].content.parts[0].text;
        chatHistory.push({ role: "model", parts: [{ text: reply }] });
        speak(reply);
      } else {
        speak("API Key में कोई दिक्कत है, कृपया Settings में जांचें।");
      }
    } catch (err) {
      modeLabel.textContent = "OFFLINE";
      speak("इंटरनेट कनेक्शन की जांच करें।");
    }
  }

  function sendText() {
    if (!textInput.value.trim()) return;
    processCommand(textInput.value);
    textInput.value = "";
  }

  // Speech Recognition (Hands-Free + Hindi/English)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;
  let keepMicAlive = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'hi-IN'; // Recognizes both Hindi & English clearly
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = () => {
      isListening = true;
      robot.classList.add('listening');
      micBtn.classList.add('active');
      micBtn.textContent = "🟢 Listening...";
      modeLabel.textContent = config.wakeWord ? 'SAY "JARVIS"' : 'LISTENING';
    };

    recognition.onresult = (event) => {
      let interim = '';
      let finalTxt = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) finalTxt += event.results[i][0].transcript;
        else interim += event.results[i][0].transcript;
      }

      if (interim) heardStrip.textContent = "Sun raha hoon: " + interim;

      if (finalTxt.trim()) {
        heardStrip.textContent = "Aapne kaha: " + finalTxt;
        handleVoiceTranscript(finalTxt.trim());
      }
    };

    recognition.onerror = (e) => {
      isListening = false;
      if (e.error === 'not-allowed') {
        keepMicAlive = false;
        resetMicUI();
        speak("Browser mein Mic permission allow karein.");
      }
    };

    recognition.onend = () => {
      isListening = false;
      if (keepMicAlive && !isSpeaking) {
        setTimeout(() => startRecognitionSafely(), 250);
      } else if (!keepMicAlive) {
        resetMicUI();
      }
    };
  }

  function startRecognitionSafely() {
    if (!recognition || isListening || isSpeaking) return;
    try { recognition.start(); } catch (e) {}
  }

  function resetMicUI() {
    robot.classList.remove('listening');
    micBtn.classList.remove('active');
    micBtn.textContent = "🎤 Mic Start";
    modeLabel.textContent = "STANDBY";
  }

  function handleVoiceTranscript(transcript) {
    if (config.wakeWord) {
      const hasWake = /(jarvis|जार्विस|jervis|service)/i.test(transcript);
      if (!hasWake) return;
      const cleaned = transcript.replace(/(hey\s+|ok\s+|hi\s+)?(jarvis|जार्विस|jervis|service)[,\s]*/gi, '').trim();
      if (!cleaned) {
        waveAndGreet();
        return;
      }
      processCommand(cleaned);
    } else {
      processCommand(transcript);
    }
  }

  function toggleMic() {
    if (!recognition) {
      speak("Kripya Google Chrome ya Microsoft Edge browser use karein.");
      return;
    }
    if (isListening || keepMicAlive) {
      keepMicAlive = false;
      try { recognition.stop(); } catch (e) {}
      resetMicUI();
    } else {
      keepMicAlive = config.continuous;
      startRecognitionSafely();
    }
  }
</script>
</body>
