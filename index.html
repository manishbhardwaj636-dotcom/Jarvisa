<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>J.A.R.V.I.S. — Voice Assistant</title>
<style>
  :root {
    --primary: #2de2ff;
    --glow: rgba(45, 226, 255, 0.45);
    --bg: #040812;
    --panel: rgba(10, 20, 40, 0.78);
    --border: rgba(45, 226, 255, 0.25);
    --text: #e6f7ff;
  }

  body.state-standby { --primary: #2de2ff; --glow: rgba(45, 226, 255, 0.38); }
  body.state-listening { --primary: #00ffaa; --glow: rgba(0, 255, 170, 0.55); }
  body.state-thinking { --primary: #ffcc4d; --glow: rgba(255, 204, 77, 0.55); }
  body.state-speaking { --primary: #9d7bff; --glow: rgba(157, 123, 255, 0.55); }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

  body {
    background: radial-gradient(circle at 50% 42%, #0a1730 0%, var(--bg) 72%);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    overflow-x: hidden;
    padding: 16px;
    transition: --primary 0.4s ease;
  }

  /* Subtle cyber grid background */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(45, 226, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45, 226, 255, 0.04) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
    z-index: 0;
  }

  /* Top HUD Bar */
  .top-bar {
    width: 100%;
    max-width: 680px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 2;
    padding: 8px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    backdrop-filter: blur(12px);
  }

  .hud-clock { font-size: 1.05rem; font-weight: 600; letter-spacing: 1px; color: var(--primary); }
  .hud-date { font-size: 0.78rem; opacity: 0.75; }

  .icon-btn {
    background: rgba(45, 226, 255, 0.1);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1.15rem;
    display: grid;
    place-items: center;
    transition: 0.25s;
  }
  .icon-btn:hover { background: rgba(45, 226, 255, 0.22); transform: scale(1.05); }

  /* Center Arc Reactor HUD */
  .reactor-stage {
    position: relative;
    width: 260px;
    height: 260px;
    display: grid;
    place-items: center;
    margin: 14px 0;
    z-index: 2;
    cursor: pointer;
    user-select: none;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: border-color 0.4s, box-shadow 0.4s;
  }

  .ring-1 {
    width: 250px; height: 250px;
    border-top-color: var(--primary);
    border-bottom-color: var(--primary);
    opacity: 0.55;
    animation: spinCW 14s linear infinite;
  }

  .ring-2 {
    width: 212px; height: 212px;
    border-left: 3px dashed var(--primary);
    border-right: 3px dashed var(--primary);
    opacity: 0.7;
    animation: spinCCW 9s linear infinite;
  }

  .ring-3 {
    width: 174px; height: 174px;
    border: 1.5px solid var(--primary);
    box-shadow: inset 0 0 18px var(--glow), 0 0 18px var(--glow);
    animation: pulseRing 2.6s ease-in-out infinite;
  }

  body.state-listening .ring-1 { animation-duration: 4s; }
  body.state-listening .ring-2 { animation-duration: 3s; }
  body.state-thinking .ring-1 { animation-duration: 2s; }
  body.state-speaking .ring-3 { animation-duration: 0.9s; }

  .core {
    width: 124px;
    height: 124px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--primary) 0%, rgba(10, 25, 48, 0.92) 72%);
    box-shadow: 0 0 32px var(--glow), inset 0 0 20px rgba(255,255,255,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: 0.35s ease;
    border: 2px solid var(--primary);
  }
  .reactor-stage:active .core { transform: scale(0.94); }

  .core-title {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 10px var(--primary);
  }

  /* Equalizer Wave Bars */
  .visualizer {
    display: flex;
    gap: 4px;
    height: 22px;
    align-items: center;
    margin-top: 6px;
  }
  .bar {
    width: 3px;
    height: 5px;
    background: #fff;
    border-radius: 3px;
    transition: height 0.15s;
  }
  body.state-listening .bar,
  body.state-speaking .bar {
    animation: eqWave 0.65s ease-in-out infinite alternate;
  }
  .bar:nth-child(2) { animation-delay: 0.12s; }
  .bar:nth-child(3) { animation-delay: 0.24s; }
  .bar:nth-child(4) { animation-delay: 0.36s; }
  .bar:nth-child(5) { animation-delay: 0.18s; }

  @keyframes spinCW { to { transform: rotate(360deg); } }
  @keyframes spinCCW { to { transform: rotate(-360deg); } }
  @keyframes pulseRing {
    0%, 100% { transform: scale(0.98); opacity: 0.75; }
    50% { transform: scale(1.03); opacity: 1; }
  }
  @keyframes eqWave {
    0% { height: 4px; }
    100% { height: 20px; }
  }

  /* Status & Transcript Area */
  .status-pill {
    z-index: 2;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.6px;
    background: var(--panel);
    border: 1px solid var(--primary);
    color: var(--primary);
    box-shadow: 0 0 14px var(--glow);
    margin-bottom: 10px;
  }

  .chat-box {
    width: 100%;
    max-width: 680px;
    z-index: 2;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    backdrop-filter: blur(12px);
    min-height: 110px;
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg-user { align-self: flex-end; background: rgba(45, 226, 255, 0.14); padding: 7px 12px; border-radius: 12px 12px 2px 12px; font-size: 0.92rem; max-width: 85%; }
  .msg-ai { align-self: flex-start; background: rgba(255, 255, 255, 0.06); border-left: 3px solid var(--primary); padding: 8px 12px; border-radius: 4px 12px 12px 12px; font-size: 0.95rem; line-height: 1.45; max-width: 92%; }

  /* Active Reminders & Timers */
  .badges-wrap {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    z-index: 2;
    margin-top: 8px;
  }
  .timer-badge {
    background: rgba(255, 204, 77, 0.14);
    border: 1px solid rgba(255, 204, 77, 0.45);
    color: #ffe299;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .timer-badge button {
    background: none; border: none; color: #ff7b7b; cursor: pointer; font-weight: bold;
  }

  /* YouTube Mini Player */
  #yt-container {
    width: 100%;
    max-width: 680px;
    margin-top: 10px;
    z-index: 2;
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .yt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    font-size: 0.82rem;
    background: rgba(0,0,0,0.4);
  }
  #yt-frame { width: 100%; height: 210px; border: none; }

  /* Settings Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 16, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    place-items: center;
    z-index: 20;
    padding: 16px;
  }
  .modal-backdrop.open { display: grid; }
  .modal {
    width: 100%;
    max-width: 500px;
    max-height: 90dvh;
    overflow-y: auto;
    background: #0b1528;
    border: 1px solid var(--primary);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 0 35px rgba(45, 226, 255, 0.25);
  }
  .modal h2 { font-size: 1.15rem; color: var(--primary); margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.82rem; margin-bottom: 4px; color: #b8dcff; }
  .field input, .field textarea, .field select {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    color: #fff;
    font-size: 0.9rem;
  }
  .field textarea { min-height: 76px; resize: vertical; }
  .check-row { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 0.88rem; }
  .check-row input { width: 18px; height: 18px; accent-color: var(--primary); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .btn {
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary { background: var(--primary); color: #03101f; border: none; }
  .btn-ghost { background: transparent; color: var(--text); }
</style>
</head>
<body class="state-standby">

  <div class="top-bar">
    <div>
      <div class="hud-clock" id="clock">00:00:00</div>
      <div class="hud-date" id="dateStr">Loading...</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" id="btnStopAll" title="चुप कराएं / Stop">⏹</button>
      <button class="icon-btn" id="btnSettings" title="Settings">⚙</button>

  <div class="reactor-stage" id="reactorBtn" title="Tap karke seedha bolein">
    <div class="ring ring-1"></div>

    <div class="core">
      <div class="core-title">JARVIS</div>
      <div class="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>
  </div>

  <div class="status-pill" id="statusPill">STANDBY • "JARVIS" बोलें या टैप करें</div>

  <div class="chat-box" id="chatBox">
    <div class="msg-ai">नमस्ते! मैं तैयार हूँ। बस <b>"Jarvis"</b> बोलकर अपना आदेश दें या बीच के गोले पर टैप करें।</div>

      </div>

<script>
const STORAGE_KEY = 'jarvis_config_v3';
let cfg = {
  handsfree: true,
  key: '',
  ytKey: '',
  model: 'gemini-2.5-flash',
  userName: 'मम्मी जी',
  contacts: '',
  favs: 'हनुमान चालीसा | AETFvQonfV8\nगायत्री मंत्र | Sarl_5g5xP8',
  autoStart: ''
};

let isAwake = false;        // True for 12s after saying "Jarvis" or tapping reactor
let awakeTimer = null;
let isSpeaking = false;
let isProcessing = false;
let recognition = null;
let restartTimeout = null;
let activeTimers = [];

// Load & Save Config
function loadCfg() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) cfg = { ...cfg, ...saved };
  } catch (e) {}
  document.getElementById('s_handsfree').checked = cfg.handsfree !== false;
  document.getElementById('s_key').value = cfg.key || '';
  document.getElementById('s_ytkey').value = cfg.ytKey || '';
  document.getElementById('s_model').value = cfg.model || 'gemini-2.5-flash';
  document.getElementById('s_name').value = cfg.userName || 'मम्मी जी';
  document.getElementById('s_contacts').value = cfg.contacts || '';
  document.getElementById('s_favs').value = cfg.favs || '';
  document.getElementById('s_start').value = cfg.autoStart || '';
}

function saveCfg() {
  cfg.handsfree = document.getElementById('s_handsfree').checked;
  cfg.key = document.getElementById('s_key').value.trim();
  cfg.ytKey = document.getElementById('s_ytkey').value.trim();
  cfg.model = document.getElementById('s_model').value.trim() || 'gemini-2.5-flash';
  cfg.userName = document.getElementById('s_name').value.trim() || 'मम्मी जी';
  cfg.contacts = document.getElementById('s_contacts').value.trim();
  cfg.favs = document.getElementById('s_favs').value.trim();
  cfg.autoStart = document.getElementById('s_start').value.trim();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  document.getElementById('settingsModal').classList.remove('open');
  addMsg('ai', 'सेटिंग्स सेव हो गई हैं।');
  if (cfg.handsfree) startListening(false);
}

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('dateStr').textContent = now.toLocaleDateString('hi-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
setInterval(updateClock, 1000);
updateClock();

// UI State & Chat Helpers
function setState(state, customText) {
  document.body.className = `state-${state}`;
  const pill = document.getElementById('statusPill');
  if (customText) {
    pill.textContent = customText;
    return;
  }
  if (state === 'listening') {
    pill.textContent = isAwake ? 'सुन रहा हूँ... बोलिए' : 'STANDBY • "JARVIS" बोलें';
  } else if (state === 'thinking') {
    pill.textContent = 'सोच रहा हूँ...';
  } else if (state === 'speaking') {
    pill.textContent = 'बोल रहा हूँ...';
  } else {
    pill.textContent = cfg.handsfree ? 'STANDBY • "JARVIS" बोलें' : 'बोलने के लिए गोले पर टैप करें';
  }
}

function addMsg(role, text) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = role === 'user' ? 'msg-user' : 'msg-ai';
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// Text-to-Speech
function speak(text, onDone) {
  window.speechSynthesis.cancel();
  if (!text) { if (onDone) onDone(); return; }
  isSpeaking = true;
  setState('speaking');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'hi-IN';
  utter.rate = 1.02;
  utter.onend = () => {
    isSpeaking = false;
    setState('standby');
    if (onDone) onDone();
    else if (cfg.handsfree) scheduleRestart(400);
  };
  utter.onerror = () => {
    isSpeaking = false;
    setState('standby');
    if (onDone) onDone();
    else if (cfg.handsfree) scheduleRestart(400);
  };
  window.speechSynthesis.speak(utter);
}

// Wake-word Window Manager
function activateAwakeWindow() {
  isAwake = true;
  setState('listening', 'सुन रहा हूँ... बोलिए');
  clearTimeout(awakeTimer);
  awakeTimer = setTimeout(() => {
    isAwake = false;
    if (!isProcessing && !isSpeaking) {
      setState(cfg.handsfree ? 'listening' : 'standby');
    }
  }, 12000);
}

// Wake-word Extractor
function extractWakeCommand(rawText) {
  const text = rawText.trim();
  // Matches "Jarvis", "Hey Jarvis", "जार्विस", "हे जार्विस", "जाविश", etc.
  const wakeRegex = /^(?:hey\s+|हे\s+|ओके\s+|ok\s+)?(?:jarvis|जार्विस|जारविस|जाविश|जर्विस)[\s,।!?-]*(.*)$/i;
  const match = text.match(wakeRegex);
  if (match) {
    return { triggered: true, command: (match[1] || '').trim() };
  }
  return { triggered: false, command: text };
}

// Speech Recognition Setup
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setState('standby', 'इस ब्राउज़र में Voice Recognition उपलब्ध नहीं है');
    return;
  }
  recognition = new SR();
  recognition.lang = 'hi-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    if (!isProcessing && !isSpeaking) {
      setState('listening');
    }
  };

  recognition.onresult = async (event) => {
    const transcript = event.results[event.results.length - 1][0].transcript.trim();
    if (!transcript || isSpeaking) return;

    if (!cfg.handsfree || isAwake) {
      // Direct command mode
      clearTimeout(awakeTimer);
      isAwake = false;
      const cleaned = extractWakeCommand(transcript);
      const finalCmd = cleaned.triggered && cleaned.command ? cleaned.command : transcript;
      await handleUserCommand(finalCmd);
    } else {
      // Standby wake-word mode
      const { triggered, command } = extractWakeCommand(transcript);
      if (triggered) {
        if (command) {
          await handleUserCommand(command);
        } else {
          activateAwakeWindow();
          speak('जी, बोलिए...', () => {
            activateAwakeWindow();
            scheduleRestart(250);
          });
        }
      }
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') {
      cfg.handsfree = false;
      setState('standby', 'माइक की अनुमति (Mic Permission) दें');
      return;
    }
    if (cfg.handsfree && !isProcessing && !isSpeaking) {
      scheduleRestart(600);
    }
  };

  recognition.onend = () => {
    if (cfg.handsfree && !isProcessing && !isSpeaking) {
      scheduleRestart(400);
    } else if (!cfg.handsfree && !isProcessing && !isSpeaking) {
      setState('standby');
    }
  };
}

function scheduleRestart(delay = 400) {
  clearTimeout(restartTimeout);
  restartTimeout = setTimeout(() => {
    startListening(false);
  }, delay);
}

function startListening(forceAwake = false) {
  if (!recognition) initRecognition();
  if (!recognition || isProcessing || isSpeaking) return;
  if (forceAwake) activateAwakeWindow();
  try {
    recognition.start();
  } catch (e) {
    // Already started
  }
}

// Tool Implementations
function extractVideoId(str) {
  const m = str.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  if (/^[A-Za-z0-9_-]{11}$/.test(str.trim())) return str.trim();
  return null;
}

function playVideoEmbed(videoId, title) {
  const container = document.getElementById('yt-container');
  const frame = document.getElementById('yt-frame');
  document.getElementById('yt-title').textContent = `▶ ${title}`;
  frame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
  container.style.display = 'block';
}

function closePlayer() {
  document.getElementById('yt-frame').src = '';
  document.getElementById('yt-container').style.display = 'none';
}

async function toolPlayMedia(query) {
  const qLower = query.toLowerCase();
  const lines = (cfg.favs || '').split('\n').map(l => l.trim()).filter(Boolean);
  for (const line of lines) {
    const [name, link] = line.split('|').map(s => s.trim());
    if (name && link && (qLower.includes(name.toLowerCase()) || name.toLowerCase().includes(qLower))) {
      const vid = extractVideoId(link);
      if (vid) {
        playVideoEmbed(vid, name);
        return `${name} चला रहा हूँ।`;
      }
    }
  }

  if (cfg.ytKey) {
    try {
      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&q=${encodeURIComponent(query)}&key=${encodeURIComponent(cfg.ytKey)}`;
      const res = await fetch(url);
      const data = await res.json();
      const item = data.items && data.items[0];
      if (item && item.id && item.id.videoId) {
        playVideoEmbed(item.id.videoId, item.snippet.title || query);
        return `YouTube पर ${query} चला दिया है।`;
      }
    } catch (e) {}
  }

  window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, '_blank');
  return `YouTube पर ${query} खोज दिया है।`;
}

function toolOpenWebsite(site) {
  const s = site.toLowerCase().trim();
  const map = {
    gmail: 'https://mail.google.com',
    mail: 'https://mail.google.com',
    maps: 'https://maps.google.com',
    whatsapp: 'https://web.whatsapp.com',
    youtube: 'https://www.youtube.com',
    google: 'https://www.google.com'
  };
  let target = map[s];
  if (!target) {
    target = s.startsWith('http') ? s : `https://${s.includes('.') ? s : s + '.com'}`;
  }
  window.open(target, '_blank');
  return `${site} खोल दिया है।`;
}

function toolSendWhatsApp(recipient, message) {
  const lines = (cfg.contacts || '').split('\n').map(l => l.trim()).filter(Boolean);
  let phone = recipient.replace(/\D/g, '');
  let matchedName = recipient;

  if (phone.length < 10) {
    phone = '';
    for (const line of lines) {
      const [name, num] = line.split('|').map(s => s.trim());
      if (name && num && name.toLowerCase().includes(recipient.toLowerCase())) {
        phone = num.replace(/\D/g, '');
        matchedName = name;
        break;
      }
    }
  }

  if (!phone) {
    return `${recipient} का नंबर कॉन्टैक्ट्स में नहीं मिला। कृपया सेटिंग्स में नंबर जोड़ें।`;
  }
  if (phone.length === 10) phone = '91' + phone;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
  return `${matchedName} के लिए WhatsApp मैसेज तैयार कर दिया है, बस Send दबा दें।`;
}

function addTimerBadge(label, timeoutId) {
  const id = Date.now() + Math.random();
  activeTimers.push({ id, label, timeoutId });
  renderBadges();
  return id;
}

function removeTimerBadge(id) {
  const idx = activeTimers.findIndex(t => t.id === id);
  if (idx !== -1) {
    clearTimeout(activeTimers[idx].timeoutId);
    activeTimers.splice(idx, 1);
    renderBadges();
  }
}

function renderBadges() {
  const wrap = document.getElementById('badgesWrap');
  wrap.innerHTML = '';
  activeTimers.forEach(t => {
    const el = document.createElement('div');
    el.className = 'timer-badge';
    el.innerHTML = `⏰ ${t.label} <button onclick="removeTimerBadge(${t.id})">✕</button>`;
    wrap.appendChild(el);
  });
}

function toolSetTimer(minutes, label = 'टाइमर') {
  const ms = Math.max(1, Number(minutes)) * 60000;
  let badgeId;
  const tid = setTimeout(() => {
    removeTimerBadge(badgeId);
    const alertMsg = `${cfg.userName}, आपका ${minutes} मिनट का ${label} पूरा हो गया है!`;
    addMsg('ai', alertMsg);
    speak(alertMsg);
  }, ms);
  badgeId = addTimerBadge(`${minutes} मिनट (${label})`, tid);
  return `${minutes} मिनट का ${label} लगा दिया है।`;
}

function toolSetReminder(time24, message) {
  const [hh, mm] = time24.split(':').map(Number);
  if (isNaN(hh) || isNaN(mm)) return 'समय समझ नहीं आया, कृपया दोबारा बोलें।';
  const now = new Date();
  const target = new Date();
  target.setHours(hh, mm, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  const diff = target - now;
  let badgeId;
  const tid = setTimeout(() => {
    removeTimerBadge(badgeId);
    const alertMsg = `${cfg.userName}, याद दिलाने का समय हो गया है: ${message}`;
    addMsg('ai', alertMsg);
    speak(alertMsg);
  }, diff);
  badgeId = addTimerBadge(`${time24} - ${message}`, tid);
  return `${time24} बजे के लिए "${message}" का रिमाइंडर लगा दिया है।`;
}

// Gemini Brain (Function Calling + Live Search Fallback)
async function handleUserCommand(userText) {
  addMsg('user', userText);
  if (!cfg.key) {
    const err = 'कृपया पहले ऊपर दाईं ओर ⚙ सेटिंग्स में जाकर अपनी Gemini API Key डालें।';
    addMsg('ai', err);
    speak(err);
    return;
  }

  isProcessing = true;
  setState('thinking');

  const sysPrompt = `आप J.A.R.V.I.S. हैं। उपयोगकर्ता को "${cfg.userName}" कहकर सम्मान से संबोधित करें। हमेशा सरल, स्पष्ट हिंदी (देवनागरी) में संक्षिप्त (1-3 वाक्य) जवाब दें। वर्तमान समय: ${new Date().toLocaleString('hi-IN')}। यदि उपयोगकर्ता आरती/भजन/गाना चलाने को कहे तो play_media चलाएं। वेबसाइट खोलने के लिए open_website चलाएं। WhatsApp मैसेज के लिए send_whatsapp चलाएं। टाइमर के लिए set_timer और किसी निश्चित समय के रिमाइंडर के लिए set_reminder (24-घंटे HH:MM फॉर्मेट) चलाएं।`;

  const functionTools = [{
    function_declarations: [
      {
        name: 'play_media',
        description: 'Play an aarti, bhajan, mantra, or song on YouTube',
        parameters: { type: 'OBJECT', properties: { query: { type: 'STRING' } }, required: ['query'] }
      },
      {
        name: 'open_website',
        description: 'Open a website like Gmail, Maps, WhatsApp, YouTube or any URL',
        parameters: { type: 'OBJECT', properties: { site: { type: 'STRING' } }, required: ['site'] }
      },
      {
        name: 'send_whatsapp',
        description: 'Prepare a WhatsApp message to a contact name or phone number',
        parameters: {
          type: 'OBJECT',
          properties: {
            recipient: { type: 'STRING' },
            message: { type: 'STRING' }
          },
          required: ['recipient', 'message']
        }
      },
      {
        name: 'set_timer',
        description: 'Set a countdown timer in minutes',
        parameters: {
          type: 'OBJECT',
          properties: {
            minutes: { type: 'NUMBER' },
            label: { type: 'STRING' }
          },
          required: ['minutes']
        }
      },
      {
        name: 'set_reminder',
        description: 'Set a reminder at a specific 24-hour time HH:MM',
        parameters: {
          type: 'OBJECT',
          properties: {
            time24: { type: 'STRING', description: '24-hour format HH:MM e.g. 08:00 or 17:30' },
            message: { type: 'STRING' }
          },
          required: ['time24', 'message']
        }
      }
    ]
  }];

  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent?key=${encodeURIComponent(cfg.key)}`;

  try {
    // 1. Check action tools first
    let res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: sysPrompt }] },
        contents: [{ role: 'user', parts: [{ text: userText }] }],
        tools: functionTools
      })
    });
    let data = await res.json();
    const parts = data?.candidates?.[0]?.content?.parts || [];
    const fnCall = parts.find(p => p.functionCall)?.functionCall;

    let replyText = '';

    if (fnCall) {
      const args = fnCall.args || {};
      if (fnCall.name === 'play_media') replyText = await toolPlayMedia(args.query);
      else if (fnCall.name === 'open_website') replyText = toolOpenWebsite(args.site);
      else if (fnCall.name === 'send_whatsapp') replyText = toolSendWhatsApp(args.recipient, args.message);
      else if (fnCall.name === 'set_timer') replyText = toolSetTimer(args.minutes, args.label || 'टाइमर');
      else if (fnCall.name === 'set_reminder') replyText = toolSetReminder(args.time24, args.message);
    } else {
      // 2. General / Live Google Search query
      const searchRes = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: sysPrompt }] },
          contents: [{ role: 'user', parts: [{ text: userText }] }],
          tools: [{ google_search: {} }]
        })
      });
      const searchData = await searchRes.json();
      replyText = searchData?.candidates?.[0]?.content?.parts?.map(p => p.text).join(' ').trim()
        || parts.map(p => p.text).join(' ').trim()
        || 'माफ़ कीजिए, मैं अभी इसका उत्तर नहीं ला पाया।';
    }

    isProcessing = false;
    addMsg('ai', replyText);
    speak(replyText);
  } catch (err) {
    isProcessing = false;
    const msg = 'नेटवर्क या API कुंजी में कोई समस्या आ रही है।';
    addMsg('ai', msg);
    speak(msg);
  }
}

document.getElementById('reactorBtn').addEventListener('click', () => {
  window.speechSynthesis.cancel();
  isSpeaking = false;
  startListening(true);
});

document.getElementById('btnStopAll').addEventListener('click', () => {
  window.speechSynthesis.cancel();
  isSpeaking = false;
  isAwake = false;
  closePlayer();
  setState(cfg.handsfree ? 'listening' : 'standby');
  if (cfg.handsfree) scheduleRestart(300);
});

document.getElementById('btnSettings').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.add('open');
});
document.getElementById('btnCloseSettings').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.remove('open');
});
document.getElementById('btnSaveSettings').addEventListener('click', saveCfg);

window.addEventListener('DOMContentLoaded', async () => {
  loadCfg();
  if (cfg.autoStart) {
    const msg = await toolPlayMedia(cfg.autoStart);
    addMsg('ai', msg);
  }
  if (cfg.handsfree) {
    startListening(false);
  }
});
